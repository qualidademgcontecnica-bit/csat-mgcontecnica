<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Departamento Pessoal</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

/* FUMAÇA */

#smoke{

position:fixed;
inset:0;

background:
radial-gradient(circle,
rgba(255,255,255,0.95),
rgba(255,255,255,0.75),
rgba(255,255,255,0.25),
transparent 75%);

opacity:0;

pointer-events:none;

z-index:9999;

backdrop-filter:blur(20px);

}

.smoke-animation{

animation:smokeEffect 3s ease-in-out;

}

@keyframes smokeEffect{

0%{
opacity:0;
transform:scale(0.8);
filter:blur(0px);
}

25%{
opacity:1;
transform:scale(1.1);
filter:blur(8px);
}

50%{
opacity:1;
transform:scale(1.3);
filter:blur(18px);
}

75%{
opacity:0.9;
transform:scale(1.5);
filter:blur(25px);
}

100%{
opacity:0;
transform:scale(1.8);
filter:blur(35px);
}

}

/* BODY */

body{

margin:0;
font-family:Arial, sans-serif;
background:#070b1a;
overflow:hidden;
color:white;

}

/* FUNDO */

.background{

position:fixed;
inset:0;

background:
linear-gradient(rgba(7,11,26,0.94), rgba(7,11,26,0.94)),
url('logo.png');

background-repeat:no-repeat;
background-position:center;
background-size:35%;

opacity:0.14;

z-index:-3;

}

/* ESTRELAS */

.background::before{

content:"✨ ✦ ⭐ ✨ ✦ ⭐ ✨";

position:absolute;

inset:0;

display:flex;

justify-content:space-around;

align-items:center;

font-size:55px;

letter-spacing:220px;

opacity:0.18;

color:#f5d76e;

animation:goldStars 10s ease-in-out infinite;

filter:
drop-shadow(0 0 10px #f5d76e);

}

@keyframes goldStars{

0%{
transform:translateY(0px);
opacity:0.15;
}

50%{
transform:translateY(-15px);
opacity:0.22;
}

100%{
transform:translateY(0px);
opacity:0.15;
}

}

/* FOGUETE */

.rocket-bg{

position:fixed;

left:-150px;

bottom:-100px;

font-size:90px;

z-index:-1;

opacity:0.15;

transform:rotate(25deg);

animation:rocketFly 12s linear infinite;

filter:drop-shadow(0 0 25px #ff003c);

}

@keyframes rocketFly{

0%{

left:-150px;
bottom:-100px;

transform:
rotate(25deg)
scale(0.8);

}

50%{

transform:
rotate(15deg)
scale(1);

}

100%{

left:110%;
bottom:120%;

transform:
rotate(8deg)
scale(1.2);

}

}

/* RANKING */

.ranking-bg{

position:fixed;

right:40px;

bottom:30px;

width:170px;

opacity:0.12;

z-index:-1;

animation:rankingFloat 5s ease-in-out infinite;

filter:
drop-shadow(0 0 10px #d4af37);

}

@keyframes rankingFloat{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}

/* CARD */

.card{

width:90%;
max-width:950px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.1);

border-radius:35px;

padding:60px;

position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

box-shadow:0 20px 50px rgba(0,0,0,0.5);

backdrop-filter:blur(8px);

}

/* LOGO */

.logo{

width:180px;

display:block;

margin:auto;

margin-bottom:30px;

}

/* TITULO */

h1{

text-align:center;

font-size:58px;

margin-bottom:10px;

}

/* SUB */

.sub{

text-align:center;

color:#cbd5e1;

margin-bottom:40px;

font-size:22px;

}

/* BARRA */

.progress{

width:100%;

height:12px;

background:#1e293b;

border-radius:30px;

overflow:hidden;

margin-bottom:50px;

}

.progress-bar{

height:100%;

width:0%;

background:#ff003c;

transition:0.4s;

}

/* PERGUNTA */

.question{

font-size:36px;

text-align:center;

line-height:1.5;

margin-bottom:60px;

min-height:120px;

}

/* BOTÕES */

.buttons{

display:grid;

grid-template-columns:repeat(5,1fr);

gap:20px;

}

.rate{

padding:25px;

border:none;

border-radius:30px;

background:#ffffff10;

color:white;

cursor:pointer;

transition:0.3s;

}

.rate:hover{

background:#ff003c;

transform:scale(1.08);

}

/* EMOJIS */

.emoji{

font-size:45px;

margin-bottom:10px;

}

/* NOTAS */

.note{

font-size:28px;

font-weight:bold;

}

/* FINAL */

.final{

display:none;

text-align:center;

padding:50px;

}

.final h2{

font-size:60px;

margin-bottom:20px;

}

.final p{

font-size:24px;

color:#cbd5e1;

margin-bottom:30px;

}

.score{

font-size:90px;

font-weight:bold;

color:#ff003c;

}

/* INPUTS */

.input{

padding:20px;
border-radius:18px;
border:none;
font-size:20px;
background:#ffffff10;
color:white;
outline:none;

}

.start-btn{

padding:22px;
border:none;
border-radius:20px;
background:#ff003c;
color:white;
font-size:22px;
cursor:pointer;
font-weight:bold;
transition:0.3s;

}

.start-btn:hover{

transform:scale(1.03);

}

</style>

</head>

<body>

<div class="background"></div>

<div class="rocket-bg">
🚀
</div>

<img src="ranking.png" class="ranking-bg">

<div id="smoke"></div>

<form id="surveyForm">

>

<div class="card">

<!-- INTRO -->

<div id="intro">

<img src="logo.png" class="logo">

<h1>
DEPARTAMENTO PESSOAL
</h1>

<div class="sub">
Antes de iniciar sua avaliação,
preencha seus dados:
</div>

<div style="display:flex; flex-direction:column; gap:20px; margin-top:40px;">

<input
type="text"
id="cliente"
name="Cliente"
placeholder="Digite seu nome completo"
class="input"
/>

<input
type="email"
id="email"
name="Email"
placeholder="Digite seu e-mail"
class="input"
/>

<button
type="button"
onclick="startSurvey()"
class="start-btn"
>
INICIAR AVALIAÇÃO 🚀
</button>

</div>

</div>

<!-- PESQUISA -->

<div id="content" style="display:none;">

<img src="logo.png" class="logo">

<h1>
DEPARTAMENTO PESSOAL
</h1>

<div class="sub">
Pesquisa de Qualidade do Cliente
</div>

<div class="progress">

<div class="progress-bar" id="progressBar"></div>

</div>

<div class="question" id="question"></div>

<div class="buttons">

<button type="button" class="rate" onclick="answer(1)">
<div class="emoji">😡</div>
<div class="note">1</div>
</button>

<button type="button" class="rate" onclick="answer(2)">
<div class="emoji">😕</div>
<div class="note">2</div>
</button>

<button type="button" class="rate" onclick="answer(3)">
<div class="emoji">😐</div>
<div class="note">3</div>
</button>

<button type="button" class="rate" onclick="answer(4)">
<div class="emoji">🙂</div>
<div class="note">4</div>
</button>

<button type="button" class="rate" onclick="answer(5)">
<div class="emoji">😄</div>
<div class="note">5</div>
</button>

</div>

</div>

<!-- FINAL -->

<div class="final" id="final">

<h2>
Obrigado!
</h2>

<p>
Sua avaliação foi enviada com sucesso.
</p>

<div class="score" id="score">
0
</div>

<p>
CSAT - Índice de Satisfação do Cliente
</p>

</div>

</div>

</form>

<script>

/* URL */

const params =
new URLSearchParams(window.location.search);

const idCoord =
params.get("id") || "CRD000";

/* COORDENADORES */

const coordenadores = {

"DPPESSOAL-DavidBraganca": {
nome: "David Braganca",
setor: "DP - DEPTO. PESSOAL"
},

"DPPESSOAL-EdivaldoVeiga": {
nome: "Edivaldo Veiga",
setor: "DP - DEPTO. PESSOAL"
},

"DPPESSOAL-LeandroMatos": {
nome: "Leandro Matos",
setor: "DP - DEPTO. PESSOAL"
},

"DPPESSOAL-MauricioLermen": {
nome: "Mauricio Lermen",
setor: "DP - DEPTO. PESSOAL"
},

"DPPESSOAL-SaraCavalheiro": {
nome: "Sara Cavalheiro",
setor: "DP - DEPTO. PESSOAL"
}

};

const dadosCoord =
coordenadores[idCoord];

/* PERGUNTAS */

const questions = [

"As informações trabalhistas e folha de pagamento são entregues corretamente?",

"O atendimento do Departamento Pessoal atende suas expectativas?",

"Você sente confiança nas orientações do setor de Departamento Pessoal?"

];

let current = 0;
let total = 0;

const question =
document.getElementById("question");

const progressBar =
document.getElementById("progressBar");

const final =
document.getElementById("final");

const content =
document.getElementById("content");

const score =
document.getElementById("score");

/* CARREGA */

function loadQuestion(){

question.innerText =
questions[current];

progressBar.style.width =
((current) / questions.length) * 100 + "%";

}

/* INICIA */

function startSurvey(){

const cliente =
document.getElementById("cliente").value.trim();

const email =
document.getElementById("email").value.trim();

/* VALIDA NOME */

const nomeCompleto =
cliente.split(" ");

if(nomeCompleto.length < 2){

alert("Digite nome e sobrenome.");

return;

}

/* VALIDA EMAIL */

const emailValido =
email.includes("@") &&
email.includes(".com");

if(!emailValido){

alert("Digite um e-mail válido.");

return;

}

/* LIBERA */

document.getElementById("intro").style.display = "none";

content.style.display = "block";

loadQuestion();

}

/* RESPOSTAS */

function answer(value){

/* SALVA */

const hidden =
document.createElement("input");

hidden.type = "hidden";

hidden.name =
questions[current];

hidden.value = value;

document.getElementById("surveyForm")
.appendChild(hidden);

/* SOMA */

total += value;

current++;

progressBar.style.width =
((current) / questions.length) * 100 + "%";

/* FINAL */

if(current >= questions.length){

content.style.display = "none";

/* FUMAÇA */

const smoke =
document.getElementById("smoke");

smoke.classList.add("smoke-animation");

/* MÉDIA */

let media =
(total / questions.length) * 2;

/* ESPERA */

setTimeout(() => {

final.style.display = "block";

score.innerText =
media.toFixed(1);

/* ENVIA */

const formData = {

id_form: "FORM003",

id_coord: idCoord,

formulario: "Departamento Pessoal",

cliente:
document.getElementById("cliente").value,

email:
document.getElementById("email").value,

csat:
media.toFixed(1),

respostas: []

};

/* CAPTURA RESPOSTAS */

const inputs =
document.querySelectorAll(
'#surveyForm input[type="hidden"]'
);

inputs.forEach(input => {

formData.respostas.push(
input.value
);

});

/* ENVIA PARA GOOGLE */

fetch(
"https://script.google.com/macros/s/AKfycbxSPdxDUaof8dpk7cwKZJp7-sGp8xQcCATZQ6mcTIOoYO-_wMbFxROosHnaM1bujUo/exec",
{

method: "POST",

mode: "no-cors",

body: JSON.stringify(formData)

}

)
.then(() => {

console.log("Enviado com sucesso");

})
.catch(error => {

console.error("Erro:", error);

});

}, 1800);

return;

}

/* PRÓXIMA */

loadQuestion();

}

</script>

</script>

</body>

</html>
